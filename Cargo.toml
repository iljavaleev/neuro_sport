[package]
name = "neuro_sport-ui"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"
log = "0.4.34"
rand = "0.10.0"
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[workspace]
members = ["src-tauri"]

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "neuro_sport-ui"

[dependencies.web-sys]
version = "0.3"
# You must explicitly enable features for the Web APIs you plan to use
features = [
  "Document",
  "Element",
  "HtmlInputElement",
  "Window",
  "HtmlAudioElement",
  "MouseEvent"
]