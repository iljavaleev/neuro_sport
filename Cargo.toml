[package]
name = "neuro_sport-ui"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1.7"
log = "0.4.34"

leptos_icons = "0.7.1"
icondata = "0.7.0"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"

[workspace]
members = ["src-tauri"]

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "neuro_sport-ui"

[dependencies.web-sys]
version = "0.3"
features = [
  "Document",
  "Element",
  "HtmlInputElement",
  "Window",
  "HtmlAudioElement",
  "MouseEvent",
  "Storage",
]
