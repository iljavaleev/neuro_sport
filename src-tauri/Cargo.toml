[package]
name = "neuro_sport"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "neuro_sport_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["config-toml"] }

[dependencies]
# --- Tauri Core & Plugins ---
tauri = { version = "2", features = ["config-toml"] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2.0.0" 

# --- Serialization & Logging ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "^0.4"

# --- Math, Utilities & System Logic ---
num_enum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.13", features = ["v4", "serde"] }

# --- Cryptography & Randomness (Upgraded for SQLx 0.9!) ---
# Rand 0.10 uses "sys_rng" instead of "os_rng" or "getrandom"
rand = { version = "0.10.0", features = ["sys_rng"] }
argon2 = { version = "0.6.0" }

# --- Database Async Engine (Upgraded to 0.9!) ---
tokio = { version = "1.53.1", features = ["full"] } 
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "sqlite", "chrono", "uuid", "json"] }

# --- Audio Subsystem ---
rodio = "0.22" 

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
